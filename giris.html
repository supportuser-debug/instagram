<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .box {
      text-align: center;
      padding: 40px;
    }
    .ig-logo {
      margin-bottom: 32px;
    }
    p {
      color: #ccc;
      font-size: 16px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 14px 48px;
      background: #1877f2;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #1565d8; }
  </style>
</head>
<body>
<div class="box">
  <div class="ig-logo">
    <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="ig" cx="28%" cy="105%" r="135%">
          <stop offset="0%" stop-color="#ffd776"/>
          <stop offset="20%" stop-color="#f4a43a"/>
          <stop offset="40%" stop-color="#eb3e53"/>
          <stop offset="60%" stop-color="#c52e8e"/>
          <stop offset="80%" stop-color="#8b37b8"/>
          <stop offset="100%" stop-color="#4159c4"/>
        </radialGradient>
      </defs>
      <rect width="64" height="64" rx="16" fill="url(#ig)"/>
      <circle cx="32" cy="32" r="11" fill="none" stroke="#fff" stroke-width="3.2"/>
      <circle cx="46.5" cy="17.5" r="3.5" fill="#fff"/>
    </svg>
  </div>
  <p>Instagram şifre sıfırlama bağlantısına<br>devam etmek için butona tıkla.</p>
  <button class="btn" onclick="devam()">Devam Et</button>
</div>

<script>
  function devam() {
    window.location.href = 'instagram.html';
  }
</script>
</body>
</html>
